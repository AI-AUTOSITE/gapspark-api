name: Fetch Reviews to D1

on:
  schedule:
    - cron: '0 */6 * * *'   # 6時間ごとに自動実行
  workflow_dispatch:          # 手動実行も可能

jobs:
  fetch-and-load:
    runs-on: ubuntu-latest
    steps:
      # apps_to_track.json を読むためにリポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # ① 追跡アプリ同期：リストにあって未追加のアプリだけ tracked_apps に追加
      - name: Sync tracked apps from list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          npx -y wrangler d1 execute gapspark-db --remote \
            --command "SELECT apple_id FROM tracked_apps" --json > tracked.json
          python3 << 'PYEOF'
          import json, subprocess, urllib.parse, time
          want = json.load(open("apps_to_track.json"))
          tracked = { str(r["apple_id"]) for r in json.load(open("tracked.json"))[0]["results"] }
          def esc(s): return (str(s) if s is not None else "").replace("'", "''")
          def itunes(url):
              try:
                  out = subprocess.run(["curl","-s","-A","Mozilla/5.0",url],
                                       capture_output=True, text=True, timeout=20).stdout
                  res = json.loads(out).get("results", [])
                  return res[0] if res else None
              except Exception: return None
          new_rows = []
          for entry in want:
              name = entry.get("name","")
              aid = entry.get("apple_id")
              if aid:
                  info = itunes(f"https://itunes.apple.com/lookup?id={aid}&country=us")
              else:
                  q = urllib.parse.quote(name)
                  info = itunes(f"https://itunes.apple.com/search?term={q}&media=software&country=us&limit=1")
              if not info:
                  print(f"  見つからない: {name or aid}"); continue
              tid = str(info["trackId"])
              if tid in tracked:
                  print(f"  既に追跡中: {info['trackName']}"); continue
              cat = entry.get("category") or info.get("primaryGenreName","")
              new_rows.append(
                  f"('{tid}', '{esc(info['trackName'])}', '{esc(cat)}', '[]', "
                  f"'{esc(info.get('artworkUrl100',''))}', {info.get('averageUserRating') or 0}, "
                  f"{info.get('userRatingCount') or 0})")
              tracked.add(tid)
              print(f"  ➕ 追加: {info['trackName']} (id={tid})")
              time.sleep(0.3)
          if new_rows:
              sql = ("INSERT OR IGNORE INTO tracked_apps "
                     "(apple_id, app_name, category, tags, icon_url, average_rating, total_ratings) VALUES\n"
                     + ",\n".join(new_rows) + ";")
              open("new_apps.sql","w").write(sql)
              print(f"==> {len(new_rows)} 個の新アプリを追加します")
          else:
              print("==> 新規追加なし（全部すでに追跡中）")
          PYEOF
          if [ -f new_apps.sql ]; then
            npx -y wrangler d1 execute gapspark-db --remote --file new_apps.sql
            echo "==> 新アプリ追加 完了"
          fi

      # ② レビュー取得 → D1書き込み（新アプリ含む全 tracked_apps が対象）
      #
      # 【2026-09-30 変更】失敗と「0件」を区別する。
      # 以前は curl の HTTP エラーも JSON 解析失敗も except で [] に化け、
      # 「そのアプリにはレビューが無い」と同じ扱いだった。Apple のレート制限も、
      # ストアから消えたアプリも、ジョブは緑のまま静かに素通りしていた。
      # Worker 側の取得を外して Actions が唯一の取得経路になったので、ここで
      # 失敗を tracked_apps.fetch_error_streak / last_fetch_error に記録し、
      # 週報に名前が出るようにする（Worker 側 fetch-reviews.ts と同じ列・同じ意味）。
      #   - HTTP エラー / JSON 不正 → 失敗（streak +1、理由を記録）
      #   - 200 で 0 件           → 成功（空）。streak を 0 に戻す
      #   - 429、または 403 が3連続 → レート制限。取れた分を保存してからジョブを赤にする
      #   - 一部だけ失敗            → ジョブは緑。Actions の画面に警告を出す
      - name: Fetch reviews to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          npx -y wrangler d1 execute gapspark-db --remote \
            --command "SELECT id, apple_id FROM tracked_apps" --json > apps.json
          python3 << 'PYEOF'
          import json, subprocess, time, re
          apps = json.load(open("apps.json"))[0]["results"]
          print(f"==> {len(apps)} アプリのレビューを取得します")

          def esc(s):
              if s is None: return ""
              return re.sub(r"\s+", " ", str(s).replace("'", "''")).strip()

          def fetch(url):
              """(HTTPステータス, 本文) を返す。curl 自体が失敗したら (None, "")"""
              try:
                  r = subprocess.run(["curl","-s","-A","Mozilla/5.0","-w","\n%{http_code}",url],
                                     capture_output=True, text=True, timeout=25)
                  body, _, code = r.stdout.rpartition("\n")
                  code = code.strip()
                  return (int(code) if code.isdigit() else None), body
              except Exception:
                  return None, ""

          rows = []
          ok_ids = []
          failed = []            # (tracked_app id, 理由)
          consecutive_403 = 0
          rate_limited = False

          for a in apps:
              aid, tid = a["apple_id"], a["id"]
              url = f"https://itunes.apple.com/us/rss/customerreviews/page=1/id={aid}/sortby=mostrecent/json"
              code, body = fetch(url)

              # --- 失敗: HTTP エラー / 無応答 ---
              if code != 200:
                  reason = f"HTTP {code}" if code else "no response"
                  failed.append((tid, reason))
                  print(f"  ✗ id={tid} {reason}")
                  consecutive_403 = consecutive_403 + 1 if code == 403 else 0
                  if code == 429 or consecutive_403 >= 3:
                      remaining = len(apps) - len(ok_ids) - len(failed)
                      print(f"::error::Apple rate limit ({reason}, {consecutive_403} x 403 in a row). Stopping; {remaining} apps not attempted.")
                      rate_limited = True
                      break
                  time.sleep(1.5)
                  continue

              # --- 失敗: 200 なのに JSON が読めない（エラーページなど） ---
              try:
                  entries = json.loads(body).get("feed", {}).get("entry")
                  entries = entries[1:] if isinstance(entries, list) else []
              except Exception:
                  failed.append((tid, "bad json"))
                  print(f"  ✗ id={tid} bad json")
                  time.sleep(0.5)
                  continue

              # --- 成功（0件を含む） ---
              consecutive_403 = 0
              ok_ids.append(tid)
              for r in entries:
                  try:
                      rows.append(
                          f"({tid}, '{esc(r['id']['label'])}', "
                          f"'{esc(r.get('author',{}).get('name',{}).get('label',''))}', "
                          f"{int(r.get('im:rating',{}).get('label','0') or 0)}, "
                          f"'{esc(r.get('title',{}).get('label',''))}', "
                          f"'{esc(r.get('content',{}).get('label',''))}', "
                          f"'{esc(r.get('im:version',{}).get('label',''))}', 'us', "
                          f"'{esc(r.get('updated',{}).get('label',''))}')")
                  except Exception:
                      pass
              time.sleep(0.5)

          print(f"==> 成功 {len(ok_ids)} / 失敗 {len(failed)} / 取得レビュー {len(rows)}")

          # 【2026-10-11 追加】「全部空」はブロックとみなす。
          # Apple は IP によって、エラーではなく正しい形の空フィード（200）を返して断る。
          # 1 本ずつ見ると「レビューの無いアプリ」と区別できないが、20 本以上が
          # 揃って 0 件になることは現実には起きない。保存も更新もせず、ジョブを赤にする。
          if len(ok_ids) >= 20 and len(rows) == 0:
              print(f"::error::All {len(ok_ids)} apps returned an empty feed with HTTP 200. "
                    "This is a soft block, not an empty store. Nothing was recorded.")
              open("soft_blocked.flag","w").write("1")
              raise SystemExit(0)

          COLS = "(tracked_app_id, review_id, author, rating, title, body, app_version, region, review_date)"
          out = []
          for i in range(0, len(rows), 50):
              out.append(f"INSERT OR IGNORE INTO reviews {COLS} VALUES")
              out.append(",\n".join(rows[i:i+50]) + ";")

          # 成功したアプリ: 取得日時を進め、エラー記録を消す
          if ok_ids:
              out.append("UPDATE tracked_apps SET last_fetched_at = datetime('now'), "
                         "fetch_error_streak = 0, last_fetch_error = NULL "
                         f"WHERE id IN ({','.join(map(str, ok_ids))});")

          # 失敗したアプリ: 連続回数を増やし、理由を残す（理由ごとにまとめる）
          by_reason = {}
          for tid, reason in failed:
              by_reason.setdefault(reason, []).append(tid)
          for reason, ids in by_reason.items():
              out.append("UPDATE tracked_apps SET last_fetched_at = datetime('now'), "
                         f"fetch_error_streak = fetch_error_streak + 1, last_fetch_error = '{esc(reason)}' "
                         f"WHERE id IN ({','.join(map(str, ids))});")

          open("reviews.sql","w").write("\n".join(out) + "\n")
          print(f"==> SQL生成完了: INSERT {(len(rows)+49)//50} 文 + UPDATE {(1 if ok_ids else 0) + len(by_reason)} 文")

          if failed:
              detail = ", ".join(f"id={t} {r}" for t, r in failed[:10])
              more = f" (+{len(failed)-10} more)" if len(failed) > 10 else ""
              print(f"::warning::{len(failed)} app(s) failed to fetch: {detail}{more}")
          if rate_limited:
              open("rate_limited.flag","w").write("1")
          PYEOF
          if [ -f soft_blocked.flag ]; then
            echo "::error::Apple soft block detected (every app returned an empty 200). Stopping."
            exit 1
          fi
          # 取れた分は必ず保存する（レート制限で途中停止しても、成功分は無駄にしない）
          if [ -s reviews.sql ]; then
            npx -y wrangler d1 execute gapspark-db --remote --file reviews.sql
            echo "==> D1書き込み 完了！"
          else
            echo "==> 取得0件。スキップ。"
          fi
          # 保存し終えてから、レート制限で止まった場合だけジョブを赤にする
          if [ -f rate_limited.flag ]; then
            echo "::error::Stopped by Apple rate limit. Partial results were saved; remaining apps will be fetched next run."
            exit 1
          fi

      # ③ 新しく追加したアプリの過去レビューを深掘り（RSS の 1〜10 ページ目）
      #
      # 【2026-10-11 追加】② は最新 50 件しか取らないので、追加したばかりのアプリは
      # 材料が 1 窓分しかない。deep_fetched_at が NULL のアプリだけ、一度だけ深掘りする。
      #
      # 「空のページ」の扱いがこのステップの要:
      #   Apple は IP によって正しい形の空フィード（200）で断る。空を見ただけで
      #   「終わり」と判断すると、ブロック中に全アプリを済みにしてしまう。
      #   - 1 ページ目が空           → 判断できない。済みにしない、試行 +1
      #   - 1 ページ目にあり、後が空 → 本当の終わり（フィードは生きていた）→ 済み
      #   - 50 件未満のページ        → 最終ページ → 済み
      #   - HTTP エラー / JSON 不正  → 失敗、試行 +1（429 か 403×3 なら全体を止める）
      #   - 試行 3 回で決着しない     → 対象から外す（DB に残るので見える）
      # 1 回の実行で最大 5 アプリ。② がレート制限で落ちたら、このステップは走らない。
      - name: Deep backfill new apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          npx -y wrangler d1 execute gapspark-db --remote \
            --command "SELECT id, apple_id FROM tracked_apps WHERE deep_fetched_at IS NULL AND deep_fetch_attempts < 3 ORDER BY deep_fetch_attempts, id LIMIT 5" \
            --json > deep_apps.json
          python3 << 'PYEOF'
          import json, subprocess, time, re
          apps = json.load(open("deep_apps.json"))[0]["results"]
          if not apps:
              print("==> 深掘り待ちのアプリはありません")
              raise SystemExit(0)
          print(f"==> {len(apps)} アプリを深掘りします")

          PAGE_SIZE = 50
          MAX_PAGE = 10

          def esc(s):
              if s is None: return ""
              return re.sub(r"\s+", " ", str(s).replace("'", "''")).strip()

          def fetch(url):
              try:
                  r = subprocess.run(["curl","-s","-A","Mozilla/5.0","-w","\n%{http_code}",url],
                                     capture_output=True, text=True, timeout=25)
                  body, _, code = r.stdout.rpartition("\n")
                  code = code.strip()
                  return (int(code) if code.isdigit() else None), body
              except Exception:
                  return None, ""

          def reviews_in(body):
              """レビューだけを返す（アプリ情報の行は im:rating を持たない）。読めなければ None"""
              try:
                  e = json.loads(body).get("feed", {}).get("entry")
              except Exception:
                  return None
              if isinstance(e, dict): e = [e]
              return [x for x in (e or []) if "im:rating" in x]

          rows, done, inconclusive = [], [], []
          consecutive_403 = 0
          rate_limited = False

          for a in apps:
              aid, tid = a["apple_id"], a["id"]
              got = 0
              outcome = None          # "done" / "inconclusive"
              for page in range(1, MAX_PAGE + 1):
                  url = f"https://itunes.apple.com/us/rss/customerreviews/page={page}/id={aid}/sortby=mostrecent/json"
                  code, body = fetch(url)
                  if code != 200:
                      consecutive_403 = consecutive_403 + 1 if code == 403 else 0
                      print(f"  ✗ id={tid} page {page}: HTTP {code}")
                      outcome = "inconclusive"
                      if code == 429 or consecutive_403 >= 3:
                          print(f"::error::Apple rate limit during deep backfill (HTTP {code}). Stopping.")
                          rate_limited = True
                      break
                  consecutive_403 = 0
                  page_reviews = reviews_in(body)
                  if page_reviews is None:
                      print(f"  ✗ id={tid} page {page}: bad json")
                      outcome = "inconclusive"
                      break
                  if not page_reviews:
                      # 1 ページ目が空なら判断できない（ブロックかもしれない）
                      outcome = "done" if page > 1 else "inconclusive"
                      break
                  for r in page_reviews:
                      try:
                          rows.append(
                              f"({tid}, '{esc(r['id']['label'])}', "
                              f"'{esc(r.get('author',{}).get('name',{}).get('label',''))}', "
                              f"{int(r.get('im:rating',{}).get('label','0') or 0)}, "
                              f"'{esc(r.get('title',{}).get('label',''))}', "
                              f"'{esc(r.get('content',{}).get('label',''))}', "
                              f"'{esc(r.get('im:version',{}).get('label',''))}', 'us', "
                              f"'{esc(r.get('updated',{}).get('label',''))}')")
                      except Exception:
                          pass
                  got += len(page_reviews)
                  if len(page_reviews) < PAGE_SIZE or page == MAX_PAGE:
                      outcome = "done"     # 最終ページ
                      break
                  time.sleep(1.0)

              (done if outcome == "done" else inconclusive).append(tid)
              print(f"  {'✓' if outcome == 'done' else '…'} id={tid}: {got} 件"
                    f"{'' if outcome == 'done' else '（決着せず。次回やり直し）'}")
              if rate_limited:
                  break
              time.sleep(1.0)

          COLS = "(tracked_app_id, review_id, author, rating, title, body, app_version, region, review_date)"
          out = []
          for i in range(0, len(rows), 50):
              out.append(f"INSERT OR IGNORE INTO reviews {COLS} VALUES")
              out.append(",\n".join(rows[i:i+50]) + ";")
          if done:
              out.append("UPDATE tracked_apps SET deep_fetched_at = datetime('now') "
                         f"WHERE id IN ({','.join(map(str, done))});")
          if inconclusive:
              out.append("UPDATE tracked_apps SET deep_fetch_attempts = deep_fetch_attempts + 1 "
                         f"WHERE id IN ({','.join(map(str, inconclusive))});")
          open("deep.sql","w").write("\n".join(out) + "\n")
          print(f"==> 深掘り: 済み {len(done)} / 決着せず {len(inconclusive)} / 取得 {len(rows)} 件")
          if inconclusive:
              print(f"::warning::{len(inconclusive)} app(s) not settled in deep backfill: "
                    + ", ".join(f"id={t}" for t in inconclusive))
          if rate_limited:
              open("deep_rate_limited.flag","w").write("1")
          PYEOF
          if [ -s deep.sql ]; then
            npx -y wrangler d1 execute gapspark-db --remote --file deep.sql
            echo "==> 深掘り 書き込み完了"
          fi
          # 深掘りは補完なので、レート制限でもジョブは赤にしない（② が本命）。警告だけ残す
          if [ -f deep_rate_limited.flag ]; then
            echo "::warning::Deep backfill stopped by rate limit. Remaining apps will continue next run."
          fi
